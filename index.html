<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5d6f52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="探光">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="stylesheet" href="styles.css">
  <title>探光 · 好奇心与生活灵感</title>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="brand">探光</div><div class="subtitle">让好奇有入口，也有出口</div></div>
      <div class="date" id="today"></div>
    </header>

    <section class="view active" id="view-today">
      <div class="direction card-soft">
        <div class="direction-row"><span>今年在解决</span><button class="text-button" data-action="edit-plan">编辑</button></div>
        <p id="annualQuestion" class="direction-text muted">还没有写下年度问题</p>
        <div class="divider"></div>
        <div class="direction-row"><span>本月在解决</span></div>
        <p id="monthlyQuestion" class="direction-text">先决定这个月最值得推进的一个问题</p>
      </div>

      <section class="focus" id="focusCard"></section>

      <button class="unknown-entry" data-view="choose">
        <span class="unknown-icon">⌁</span>
        <span><strong>我现在不知道做什么</strong><small>按时间、能量和意图，只给我几个选择</small></span>
        <span>›</span>
      </button>

      <div class="section-title"><h2>安静的收集箱</h2><button class="text-button" data-view="inbox">每周整理</button></div>
      <div class="inbox-summary card-soft">
        <div><strong id="questionCount">0</strong><span>个好奇问题</span></div>
        <div><strong id="lifeCount">0</strong><span>个生活愿望</span></div>
        <div><strong id="shortlistCount">0/3</strong><span>个本周候选</span></div>
      </div>
      <p class="quiet-note">这里只显示数量，不展示题目。收下来不等于现在就要解决。</p>
    </section>

    <section class="view" id="view-choose">
      <div class="page-heading"><div><span class="kicker">不知道做什么时</span><h1>先看看此刻的你</h1></div></div>
      <div class="chooser card-soft">
        <label>我有多少时间？</label>
        <div class="segmented" data-choice="time">
          <button class="active" data-value="10">10 分钟</button><button data-value="60">30–60 分钟</button><button data-value="half">半天以上</button>
        </div>
        <label>我现在的能量？</label>
        <div class="segmented" data-choice="energy">
          <button data-value="low">低</button><button class="active" data-value="mid">中</button><button data-value="high">高</button>
        </div>
        <label>我此刻更想要？</label>
        <div class="intent-grid" data-choice="intent">
          <button class="active" data-value="main">🎯<span>推进主线</span></button>
          <button data-value="explore">🔍<span>限时探索</span></button>
          <button data-value="life">🍃<span>体验生活</span></button>
          <button data-value="recover">☁️<span>恢复状态</span></button>
        </div>
        <button class="primary wide" data-action="recommend">给我几个选择</button>
      </div>
      <div id="recommendations" class="recommendations"></div>
    </section>

    <section class="view" id="view-inbox">
      <div class="page-heading"><div><span class="kicker">每周整理一次</span><h1>灵感收集箱</h1></div><button class="round-add" data-action="capture">＋</button></div>
      <div class="tabs" data-inbox-tabs><button class="active" data-kind="question">好奇问题</button><button data-kind="life">生活愿望</button></div>
      <div id="inboxList" class="cards"></div>
    </section>

    <section class="view" id="view-review">
      <div class="page-heading"><div><span class="kicker">轻轻合上今天</span><h1>带走一束光</h1></div></div>
      <div class="review card-soft">
        <label for="reviewText">今天发现了什么？下一步最小行动是什么？</label>
        <textarea id="reviewText" placeholder="不必完整，留下真正有用的一句话就好。"></textarea>
        <button class="primary" data-action="save-review">保存今日复盘</button>
      </div>
      <div class="section-title"><h2>最近留下的光</h2></div>
      <div id="reviewHistory" class="cards"></div>
    </section>
  </main>

  <button class="floating-add" data-action="capture" aria-label="收下灵感">＋</button>
  <nav class="nav">
    <button class="active" data-view="today"><span>✦</span>今日</button>
    <button data-view="choose"><span>⌁</span>做什么</button>
    <button data-view="inbox"><span>◇</span>收集箱</button>
    <button data-view="review"><span>◌</span>复盘</button>
  </nav>

  <div class="modal" id="captureModal"><form class="sheet" id="captureForm">
    <div class="sheet-head"><div><span class="kicker">先收下来，不立刻展开</span><h2>收下一颗灵感</h2></div><button type="button" class="close" data-close>×</button></div>
    <div class="tabs compact" data-capture-tabs><button type="button" class="active" data-kind="question">一个问题</button><button type="button" data-kind="life">想体验的生活</button></div>
    <div class="field"><label id="captureTitleLabel">我想探索的问题</label><textarea id="captureTitle" required placeholder="为什么……？如果……会怎样？"></textarea></div>
    <div id="questionFields"><div class="field"><label>领域</label><select id="questionTag"><option>工作</option><option>科普</option><option>技术</option><option>生活</option><option>其他</option></select></div></div>
    <div id="lifeFields" hidden>
      <div class="row"><div class="field"><label>类型</label><select id="lifeCategory"><option>探店</option><option>美食</option><option>书</option><option>电影</option><option>地点</option><option>活动</option><option>联系某人</option><option>其他</option></select></div><div class="field"><label>需要时间</label><select id="lifeTime"><option value="10">10 分钟</option><option value="60">30–60 分钟</option><option value="half">半天以上</option></select></div></div>
      <div class="field"><label>适合什么能量？</label><select id="lifeEnergy"><option value="low">低能量也可以</option><option value="mid">中等能量</option><option value="high">高能量</option></select></div>
    </div>
    <button class="primary wide">收进箱子</button>
  </form></div>

  <div class="modal" id="planModal"><form class="sheet" id="planForm">
    <div class="sheet-head"><div><span class="kicker">方向层</span><h2>我正在解决什么</h2></div><button type="button" class="close" data-close>×</button></div>
    <div class="field"><label>今年最值得建设的问题（最多 1–3 个）</label><textarea id="annualInput" placeholder="怎样把好奇心转化为稳定行动？"></textarea></div>
    <div class="field"><label>本月唯一主要问题</label><textarea id="monthlyInput" placeholder="这个月用什么现实证据推进它？"></textarea></div>
    <button class="primary wide">保存方向</button>
  </form></div>

  <div class="modal" id="contractModal"><form class="sheet" id="contractForm">
    <div class="sheet-head"><div><span class="kicker">开始前先定位终点</span><h2>探索小契约</h2></div><button type="button" class="close" data-close>×</button></div>
    <input type="hidden" id="contractId">
    <div class="contract-question" id="contractQuestion"></div>
    <div class="field"><label>这次探索是为了什么？</label><input id="contractPurpose" required placeholder="获得基本答案 / 做一个决定…"></div>
    <div class="row"><div class="field"><label>探索层级</label><select id="contractLevel"><option value="快速知道">快速知道</option><option value="初步理解">初步理解</option><option value="帮助决定">帮助决定</option><option value="形成产出">形成产出</option></select></div><div class="field"><label>时间上限</label><select id="contractMinutes"><option value="15">15 分钟</option><option value="45" selected>45 分钟</option><option value="90">90 分钟</option><option value="project">独立项目</option></select></div></div>
    <div class="field"><label>做到什么就结束？</label><input id="contractDone" required placeholder="我能用三句话解释；找到两个可信来源…"></div>
    <div class="field"><label>这次暂时不研究</label><input id="contractNotNow" placeholder="历史细节、相邻机制、所有可能方案…"></div>
    <div class="field"><label>第一步</label><input id="contractNext" placeholder="打开一篇综述 / 比较三个选项…"></div>
    <button class="primary wide">开始这一次探索</button>
  </form></div>

  <div class="modal" id="finishModal"><form class="sheet" id="finishForm">
    <div class="sheet-head"><div><span class="kicker">到达终点就停下来</span><h2>结束这次探索</h2></div><button type="button" class="close" data-close>×</button></div>
    <div class="field"><label>我得到的答案 / 证据</label><textarea id="finishResult" required placeholder="用几句话留下真正有用的结论。"></textarea></div>
    <div class="field"><label>它现在去哪里？</label><select id="finishState"><option value="understood">已理解，合上它</option><option value="project">转化为项目</option><option value="shortlist">仍值得探索，放回本周候选</option><option value="inbox">暂时开放，放回 Inbox</option></select></div>
    <div class="field"><label>下一步（可选）</label><input id="finishNext" placeholder="做一个决定 / 安排一个实验…"></div>
    <label class="check"><input type="checkbox" id="parkBranches" checked> 把停车场里的分支问题送入 Curiosity Inbox</label>
    <button class="primary wide">结束并保存</button>
  </form></div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>

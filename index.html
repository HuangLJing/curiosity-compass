<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5d6f52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="探光">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <title>探光 · 好奇心探索</title>
  <style>
    :root{--ink:#263126;--muted:#6d776b;--paper:#f7f5ed;--card:#fffdf7;--leaf:#5d6f52;--leaf2:#dfe7d8;--sun:#e7a95d;--line:#e6e3d8;--shadow:0 10px 28px #3d4d3920}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:radial-gradient(circle at 90% 0,#edf1df 0,transparent 35%),var(--paper);min-height:100vh}.shell{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-family:Georgia,"Songti SC",serif;font-size:29px;font-weight:700;letter-spacing:2px}.date{font-size:13px;color:var(--muted)}.focus{padding:22px;border-radius:24px;color:white;background:linear-gradient(135deg,#63765a,#45573f);box-shadow:var(--shadow);position:relative;overflow:hidden}.focus:after{content:"✦";position:absolute;right:18px;top:10px;font-size:56px;color:#ffffff18}.eyebrow{font-size:12px;letter-spacing:1.5px;opacity:.8}.focus h1{font:700 23px/1.35 Georgia,"Songti SC",serif;margin:8px 0 4px}.focus p{font-size:14px;opacity:.82;margin:0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}.section-title h2{font-size:18px;margin:0}.section-title button,.linkbtn{border:0;background:transparent;color:var(--leaf);font-weight:600}.quick{display:flex;gap:10px}.quick input{min-width:0;flex:1;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;font-size:16px;outline:none}.quick button,.primary{border:0;border-radius:16px;background:var(--leaf);color:white;font-weight:700;padding:0 18px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:8px 12px;font-size:13px;color:var(--muted)}.chip.active{background:var(--leaf2);border-color:#bac9b2;color:#34442f;font-weight:700}.cards{display:grid;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:0 3px 12px #35402e0a}.card-top{display:flex;justify-content:space-between;gap:10px}.question{font-weight:700;line-height:1.45}.tag{font-size:12px;color:var(--leaf);background:var(--leaf2);border-radius:999px;padding:4px 9px;height:max-content}.meta{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.status{border:0;background:#f0eee5;border-radius:10px;padding:7px 9px;color:#586054}.star{border:0;background:transparent;font-size:21px;color:#c5c4bb}.star.on{color:var(--sun)}.empty{text-align:center;color:var(--muted);padding:28px 10px}.review{display:grid;gap:10px}.review textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;font:inherit;min-height:84px;resize:vertical}.review-actions{display:flex;justify-content:flex-end}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf5eF;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 12px}.nav button.active{color:var(--leaf);font-weight:700}.modal{position:fixed;inset:0;background:#1f291f66;display:none;align-items:flex-end;z-index:9}.modal.open{display:flex}.sheet{background:var(--paper);width:100%;max-width:680px;margin:auto;border-radius:26px 26px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:13px;padding:12px;background:white;font:inherit}.row{display:flex;gap:10px}.row>*{flex:1}.sheet-actions{display:flex;gap:10px;margin-top:18px}.sheet-actions button{min-height:46px;flex:1;border-radius:14px;border:0;font-weight:700}.cancel{background:#e8e6dd;color:var(--ink)}@media(min-width:700px){.nav{max-width:680px;left:50%;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}
  </style>
</head>
<body><main class="shell">
  <header><div class="brand">探光</div><div class="date" id="today"></div></header>
  <section class="focus" id="focusBox"><div class="eyebrow">今日探索重心</div><h1 id="focusText">从一个让你“哇”的问题开始</h1><p>点亮一张卡片，它就会来到这里。</p></section>
  <section><div class="section-title"><h2>Curiosity Inbox</h2><button onclick="openModal()">完整记录 ＋</button></div><div class="quick"><input id="quickInput" placeholder="刚刚冒出了什么问题？"><button onclick="quickAdd()">收下</button></div></section>
  <section><div class="section-title"><h2>探索地图</h2><button onclick="clearFilter()">全部</button></div><div class="filters" id="filters"></div><div class="cards" id="cards"></div></section>
  <section id="reviewSection"><div class="section-title"><h2>今天，带走一束光</h2></div><div class="review"><textarea id="review" placeholder="我发现了什么？下一步最小行动是什么？"></textarea><div class="review-actions"><button class="primary" onclick="saveReview()">保存今日复盘</button></div></div></section>
</main>
<nav class="nav"><button class="active" onclick="scrollTo(0,0)">✦ 今日</button><button onclick="document.querySelector('.cards').scrollIntoView({behavior:'smooth'})">⌁ 探索</button><button onclick="document.querySelector('#reviewSection').scrollIntoView({behavior:'smooth'})">◌ 复盘</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><form class="sheet" onsubmit="addItem(event)"><h2>收下一颗好奇</h2><div class="field"><label>我想探索的问题</label><textarea id="q" required placeholder="为什么……？如果……会怎样？"></textarea></div><div class="row"><div class="field"><label>领域</label><select id="tag"><option>工作</option><option>科普</option><option>技术</option><option>生活</option><option>其他</option></select></div><div class="field"><label>状态</label><select id="status"><option>想探索</option><option>进行中</option><option>已理解</option><option>转化项目</option></select></div></div><div class="field"><label>下一步（可选）</label><input id="next" placeholder="读一篇文章 / 问一个人…"></div><div class="sheet-actions"><button type="button" class="cancel" onclick="closeModal()">取消</button><button class="primary">保存</button></div></form></div>
<script>
const KEY='tanguang-v1', STATES=['想探索','进行中','已理解','转化项目'], TAGS=['工作','科普','技术','生活','其他'];let filter='全部';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{items:[{id:Date.now(),q:'什么问题会让我今天真正想追下去？',tag:'工作',status:'想探索',next:'写下三个候选问题',focus:true}],reviews:{}};
const day=()=>new Date().toISOString().slice(0,10);const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};
function render(){document.querySelector('#today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());let f=data.items.find(x=>x.focus);document.querySelector('#focusText').textContent=f?f.q:'从一个让你“哇”的问题开始';document.querySelector('#filters').innerHTML=['全部',...TAGS].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('');let list=data.items.filter(x=>filter==='全部'||x.tag===filter);document.querySelector('#cards').innerHTML=list.length?list.map(x=>`<article class="card"><div class="card-top"><div class="question">${esc(x.q)}</div><span class="tag">${x.tag}</span></div>${x.next?`<div style="color:var(--muted);font-size:13px;margin-top:8px">下一步：${esc(x.next)}</div>`:''}<div class="meta"><select class="status" onchange="move(${x.id},this.value)">${STATES.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><button class="star ${x.focus?'on':''}" title="设为今日重心" onclick="focusItem(${x.id})">${x.focus?'★':'☆'}</button></div></article>`).join(''):'<div class="empty">这里还没有问题。先收下一颗好奇吧。</div>';document.querySelector('#review').value=data.reviews[day()]||''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openModal(seed=''){document.querySelector('#q').value=seed;document.querySelector('#modal').classList.add('open');setTimeout(()=>document.querySelector('#q').focus(),100)}function closeModal(){document.querySelector('#modal').classList.remove('open')}function quickAdd(){let v=document.querySelector('#quickInput').value.trim();if(!v)return;openModal(v);document.querySelector('#quickInput').value=''}function addItem(e){e.preventDefault();data.items.unshift({id:Date.now(),q:q.value.trim(),tag:tag.value,status:status.value,next:next.value.trim(),focus:false});closeModal();e.target.reset();save()}function move(id,status){data.items.find(x=>x.id===id).status=status;save()}function focusItem(id){data.items.forEach(x=>x.focus=x.id===id?!x.focus:false);save();scrollTo({top:0,behavior:'smooth'})}function setFilter(x){filter=x;render()}function clearFilter(){setFilter('全部')}function saveReview(){data.reviews[day()]=document.querySelector('#review').value.trim();save();let b=document.querySelector('.review-actions button');b.textContent='已保存 ✓';setTimeout(()=>b.textContent='保存今日复盘',1200)}document.querySelector('#quickInput').addEventListener('keydown',e=>{if(e.key==='Enter')quickAdd()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
